# Chrony configuration for Milk-V Duo with PPS + NMEA

# Use public servers from the pool.ntp.org project.
# Please consider joining the pool (https://www.pool.ntp.org/join.html).
server ntp.ntsc.ac.cn iburst
server edu.ntp.org.cn iburst
server ntp.aliyun.com iburst
server cn.pool.ntp.org iburst

# Serve time even if not synced (for local use)
local stratum 10

# PPS source (requires /dev/pps0 from GPIO)
refclock PPS /dev/pps0 refid PPS precision 1e-9 lock LOCL

# NMEA source via SOCK (assumes a program feeds /var/run/nmea.sock)
# refclock SOCK /var/run/nmea.sock refid NMEA

# Allow clients on local network to sync
allow 0.0.0.0/0

# Record the rate at which the system clock gains/losses time.
driftfile /var/lib/chrony/drift

# Allow the system clock to be stepped in the first three updates
# if its offset is larger than 1 second.
makestep 1.0 3

# Enable kernel synchronization of the real-time clock (RTC).
rtcsync

# Specify directory for log files.
logdir /var/log/chrony

# Select which information is logged.
log measurements statistics tracking
